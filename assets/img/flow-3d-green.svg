<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="三维绿量反演流程示意">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e141b"/>
      <stop offset="1" stop-color="#0d1a16"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#fbg)"/>

  <g fill="#121a23" stroke="#1f2b38" stroke-width="2">
    <rect x="70" y="130" width="270" height="140" rx="16"/>
    <rect x="465" y="130" width="270" height="140" rx="16"/>
    <rect x="860" y="130" width="270" height="140" rx="16"/>
  </g>

  <g stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
    <path d="M340 200 H465"/>
    <path d="M735 200 H860"/>
  </g>
  <g fill="url(#fline)">
    <path d="M465 200 l-16 -9 v18 z"/>
    <path d="M860 200 l-16 -9 v18 z"/>
  </g>

  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="205" y="188" font-size="26" fill="#e6edf3">遥感影像输入</text>
    <text x="205" y="226" font-size="19" fill="#8b98a5">城市遥感影像与高度信息</text>

    <text x="600" y="188" font-size="26" fill="#e6edf3">植被提取</text>
    <text x="600" y="226" font-size="19" fill="#8b98a5">模型训练得到植被分布</text>

    <text x="995" y="188" font-size="26" fill="#e6edf3">三维绿量反演</text>
    <text x="995" y="226" font-size="19" fill="#8b98a5">GIS 处理与成果输出</text>
  </g>

  <text x="600" y="352" font-family="ui-monospace, Consolas, monospace" font-size="20" fill="#8b98a5" text-anchor="middle">整体流程示意，具体实现细节可自行细化</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="项目封面：基于 ROS2 的无人车智能导航平台">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <radialGradient id="p2glow" cx="0.72" cy="0.68" r="0.8">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p2cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="p2grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#152238" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#p2bg)"/>
  <rect width="1200" height="750" fill="url(#p2glow)"/>
  <rect width="1200" height="750" fill="url(#p2grid)"/>

  <text x="88" y="128" font-family="ui-monospace, Consolas, monospace" font-size="42" font-weight="700" letter-spacing="6" fill="#e6edf3">PROJECT 02</text>
  <text x="88" y="180" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="26" fill="#8b98a5">ROS2 无人车 · 定位 / 建图 / 导航</text>

  <path d="M700 420 L520 250 L880 250 Z" fill="url(#p2cone)"/>
  <g stroke="#60a5fa" stroke-width="3" fill="none" stroke-dasharray="12 10" stroke-opacity="0.75">
    <path d="M300 640 C420 640 470 560 560 520 C660 474 720 470 830 470"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="300" cy="640" r="12"/>
    <circle cx="560" cy="520" r="9" opacity="0.85"/>
    <circle cx="830" cy="470" r="12"/>
  </g>

  <g transform="translate(620 400)">
    <rect x="0" y="0" width="180" height="110" rx="18" fill="#17212c" stroke="#60a5fa" stroke-width="3"/>
    <rect x="30" y="-34" width="120" height="30" rx="8" fill="#121a23" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="30" cy="122" r="20" fill="#121a23" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="150" cy="122" r="20" fill="#121a23" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="52" y="34" width="76" height="34" rx="6" fill="#0b0f14" stroke="#1f2b38" stroke-width="2"/>
    <circle cx="90" cy="51" r="8" fill="#2dd4bf"/>
  </g>

  <g fill="#8b98a5" font-family="ui-monospace, Consolas, monospace" font-size="20">
    <text x="300" y="684">起点</text>
    <text x="800" y="430">目标点</text>
  </g>
</svg>
